
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA México</title>
<style>
body {
  margin: 0;
  background: #222;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 { color: orange; }
canvas {
  background: #555;
  width: 100%;
  max-width: 600px;
  border: 3px solid orange;
}
button {
  padding: 15px 25px;
  margin: 8px;
  font-size: 20px;
  border-radius: 10px;
}
</style>
</head>
<body>
<h1>GTA MÉXICO 🇲🇽</h1>
<p>Vida Callejera</p>
<canvas id="game" width="600" height="400"></canvas>
<div>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(0,-1)">⬆️</button>
<button onclick="move(0,1)">⬇️</button>
<button onclick="move(1,0)">➡️</button>
</div>
<p id="info">¡Explora la ciudad!</p>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let player = {x:300,y:200};
function draw() {
 ctx.fillStyle="#555";
 ctx.fillRect(0,0,600,400);
 ctx.fillStyle="#333";
 ctx.fillRect(0,0,600,70);
 ctx.fillRect(0,330,600,70);
 ctx.fillRect(0,150,600,100);
 ctx.fillStyle="#228B22";
 ctx.fillRect(30,90,100,40);
 ctx.fillRect(450,270,100,40);
 ctx.fillStyle="#ffcc00";
 ctx.fillRect(player.x-12,player.y-12,24,24);
 ctx.fillStyle="black";
 ctx.fillRect(player.x-5,player.y-5,10,10);
}
function move(x,y) {
 player.x=Math.max(15,Math.min(585,player.x+x*15));
 player.y=Math.max(15,Math.min(385,player.y+y*15));
 draw();
}
draw();
</script>
</body>
</html>
